<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Nicolás Brill, Ingeniero Informático, Core Consulting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#10263d"/>
      <stop offset="1" stop-color="#0f5b52"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3a1"/>
      <stop offset="1" stop-color="#5aa9ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .fade{opacity:0;animation:in 1s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:0}}
      .cur{animation:blink 1s steps(1) infinite}
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="800" cy="50" r="130" fill="#4fc3a1" fill-opacity="0.08"/>
  <circle cx="860" cy="230" r="90" fill="#5aa9ff" fill-opacity="0.08"/>
  <text class="fade d1" x="60" y="105" font-size="22" fill="#4fc3a1" letter-spacing="3">&lt;/&gt; INGENIERO INFORMÁTICO</text>
  <text class="fade d2" x="60" y="160" font-size="58" font-weight="700" fill="#ffffff">Nicolás Brill</text>
  <rect class="fade d2" x="60" y="176" width="120" height="4" rx="2" fill="url(#ac)"/>
  <text class="fade d3" x="60" y="215" font-size="22" fill="#c9d6e2">Fundador de <tspan fill="url(#ac)" font-weight="600">Core Consulting</tspan> · Software a medida<tspan class="cur" fill="#4fc3a1"> ▍</tspan></text>
</svg>
